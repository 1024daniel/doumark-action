# .github/workflows/douban.yml
name: douban
on: 
  workflow_dispatch:
  schedule:
  - cron: "30 * * * *"

permissions:
  contents: write

jobs:
  douban:
    name: Douban mark data sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: movie
      uses: lizheming/doumark-action@master
      with:
        id: x1024daniel
        type: movie
        status: done
        format: csv
        dir: ./data/douban

    - name: music
      uses: lizheming/doumark-action@master
      with:
        id: x1024daniel
        type: music
        status: done
        format: csv
        dir: ./data/douban
  
    - name: Commit
      uses: EndBug/add-and-commit@v8
      with:
        message: 'chore: update douban data'
        add: './data/douban'
